[theme]
# Light, Swiss-style compliance workbench: trust navy, muted gold accent, slate neutrals.
base = "light"
primaryColor = "#1e3a8a"
backgroundColor = "#f6f7f9"
secondaryBackgroundColor = "#eef1f5"
textColor = "#0f172a"
linkColor = "#1e3a8a"
borderColor = "#dde2ea"
showWidgetBorder = true
baseRadius = "6px"
baseFontSize = 15
font = "IBM Plex Sans:https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
codeFont = "IBM Plex Mono:https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap"
headingFont = "IBM Plex Sans:https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
showSidebarBorder = true

[theme.sidebar]
backgroundColor = "#ffffff"

[client]
toolbarMode = "minimal"

[server]
headless = true

[browser]
gatherUsageStats = false
